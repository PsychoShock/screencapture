name: PStudio resource release
on:
  push:
    tags: ['v*-pstudio.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.11.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install resource dependencies
        run: pnpm --filter @screencapture/nui... --filter @screencapture/game... install --frozen-lockfile --ignore-scripts
      - name: Build resource
        run: |
          pnpm --filter @screencapture/gameview build
          pnpm --filter @screencapture/game build
          pnpm --filter @screencapture/nui build
      - name: Package resource
        run: |
          mkdir -p release/screencapture/game/nui
          cp README.md LICENSE fxmanifest.lua release/screencapture/
          cp -r game/dist release/screencapture/game/
          cp -r game/nui/dist release/screencapture/game/nui/
          cd release
          zip -r ../screencapture.zip screencapture
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" screencapture.zip --title "PStudio $GITHUB_REF_NAME" --generate-notes --verify-tag
